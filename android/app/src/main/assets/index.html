<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>WRLD</title>
<style>
:root{color-scheme:dark;--fg:#f7f7f7;--muted:#a7a7a7;--line:rgba(255,255,255,.12);--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Roboto","Segoe UI",system-ui,sans-serif;background:#050505;color:var(--fg);min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer;color:inherit;border:0;background:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:1px solid white;outline-offset:3px}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.haze{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 70% 50% at 88% 6%,rgba(255,255,255,.04),transparent 78%),radial-gradient(ellipse 65% 50% at 10% 90%,rgba(255,255,255,.025),transparent)}
.shell{position:relative;z-index:1;max-width:820px;margin:auto;padding:19px 19px calc(194px + env(safe-area-inset-bottom));min-height:100vh}
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:15px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-logo{padding:0;display:flex;gap:0;align-items:center;justify-content:center;height:46px;width:91px;flex:none;white-space:nowrap;color:white;transition:filter .5s var(--ease)}

.digit{display:inline-block;font-size:39px;font-style:italic;line-height:1;letter-spacing:-.14em;font-weight:730;transform-origin:50% 58%;animation:ninewave 2.7s cubic-bezier(.44,0,.21,1) infinite}
.digit:nth-child(2){animation-delay:.17s}.digit:nth-child(3){animation-delay:.34s}
@keyframes ninewave{0%,16%,66%,100%{transform:translateY(0) rotate(0);opacity:.84}35%{transform:translateY(-7px) rotate(-4deg);opacity:1}48%{transform:translateY(1px) rotate(1deg);opacity:.95}}
.brand-text{display:flex;flex-direction:column;gap:3px;overflow:hidden}
.brand-text strong{font-size:16px;letter-spacing:.31em;font-weight:670}
.brand-text small{color:#a3a3a3;letter-spacing:.15em;font-size:9px;text-transform:uppercase}
.outline{border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:10px 12px;background:rgba(255,255,255,.025);font-size:11px;letter-spacing:.02em;white-space:nowrap}
.outline:active{background:rgba(255,255,255,.16)}
.hero{padding:28px 1px 16px}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.23em;color:#a5a5a5}
.hero h1{font-size:clamp(26px,7vw,39px);margin:7px 0 6px;letter-spacing:-.045em;line-height:1.1;font-weight:650}
.hero p{margin:0;color:#9c9c9c;font-size:12px;line-height:1.5}
.search-wrap{display:flex;align-items:center;border-bottom:1px solid rgba(255,255,255,.25);height:47px;margin:7px 0 15px;gap:12px;color:#ccc}
.search-wrap svg{width:17px;height:17px;flex:none}
.search-wrap input{flex:1;min-width:0;color:white;border:0;background:transparent;outline:0;font-size:14px}
.search-wrap input::placeholder{color:#7f7f7f}
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);align-items:center;white-space:nowrap}
.tab{color:#9d9d9d;padding:14px 0 13px;font-size:13px;position:relative;font-weight:530}
.tab.active{color:#fff}
.tab.active:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:3px;background:#f4f4f4;box-shadow:0 0 12px rgba(255,255,255,.25)}
.shuffle-all-row{display:flex;align-items:center;gap:12px;margin:0 0 17px}
.shuffle-all{display:flex;align-items:center;justify-content:center;gap:10px;flex:none;min-height:42px;padding:0 16px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.095);color:#f6f6f6;border-radius:12px;font-size:12px;font-weight:620;letter-spacing:.025em;transition:transform .18s,background .18s,border-color .18s}
.shuffle-all svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.shuffle-all:active:not(:disabled){transform:scale(.96);background:rgba(255,255,255,.18)}
.shuffle-all:disabled{opacity:.35;cursor:default}
.shuffle-hint{font-size:11px;color:#999;line-height:1.4;min-width:0}
.toolbar{min-height:66px;padding:18px 0 12px;display:flex;align-items:center;justify-content:space-between;gap:11px}
.toolbar-left{display:flex;flex-direction:column;gap:4px;min-width:0}
.toolbar-title{font-size:15px;font-weight:620;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.toolbar-sub{font-size:11px;color:#939393}
.sort-control{display:flex;align-items:center;gap:4px;color:#a8a8a8;font-size:11px;flex:none}
.sort-control select{background:#171717;color:#eee;border:1px solid rgba(255,255,255,.17);border-radius:9px;padding:8px 7px;max-width:135px;font-size:11px}
.list{display:flex;flex-direction:column;min-height:80px}
.track{position:relative;display:grid;grid-template-columns:42px minmax(0,1fr) auto 31px 28px;align-items:center;gap:11px;min-height:68px;padding:10px 2px;border-bottom:1px solid rgba(255,255,255,.07);border-radius:5px;transition:background .25s var(--ease)}
.track:active,.track.is-current{background:linear-gradient(90deg,rgba(255,255,255,.105),rgba(255,255,255,.012))}
.track.is-current:before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:2px;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.3)}
.track-art{width:42px;height:42px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.15);border-radius:10px;background:linear-gradient(130deg,rgba(255,255,255,.09),rgba(255,255,255,.01));color:#e9e9e9;font-size:24px;font-style:italic;font-weight:620;pointer-events:none}
.track-main{display:flex;flex-direction:column;gap:4px;min-width:0}
.track-title{font-size:13px;font-weight:580;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-sub{font-size:11px;color:#898989;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-length{font-size:11px;color:#a6a6a6;font-variant-numeric:tabular-nums}
.icon-btn{width:30px;height:34px;padding:5px;display:grid;place-items:center;opacity:.72}
.icon-btn svg{width:18px;height:18px;stroke:#ddd;stroke-width:1.8;fill:none}
.icon-btn.liked{opacity:1}
.icon-btn.liked svg{fill:#fff;stroke:#fff}
.icon-btn:active{transform:scale(.88)}
.plus{font-size:23px;font-weight:250;line-height:1}
.empty{text-align:center;padding:48px 17px;color:#939393;font-size:13px;line-height:1.6}
.empty b{display:block;font-size:16px;color:#eee;margin-bottom:7px}
.playlist-grid{display:flex;flex-direction:column;gap:12px;padding:9px 0 20px}
.playlist-card{display:flex;align-items:center;gap:14px;border:1px solid rgba(255,255,255,.15);border-radius:17px;background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.019));padding:14px;text-align:left;min-height:87px}
.playlist-card:active{transform:scale(.985);background:rgba(255,255,255,.1)}
.playlist-cover{height:55px;width:55px;border-radius:12px;background:linear-gradient(130deg,#353535,#0c0c0c);display:grid;place-items:center;border:1px solid rgba(255,255,255,.13);font-size:24px}
.playlist-name{font-size:14px;font-weight:600;display:block}
.playlist-count{font-size:11px;color:#aaa;display:block;margin-top:5px}
.playlist-create{border:1px dashed rgba(255,255,255,.25);background:rgba(255,255,255,.022)}
.tiny-action{font-size:11px;color:#ddd;border:1px solid rgba(255,255,255,.19);padding:7px 10px;border-radius:9px}
.dock{position:fixed;z-index:4;bottom:0;left:0;right:0;padding:13px 19px calc(15px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(13,13,13,.89),rgba(5,5,5,.98));border-top:1px solid rgba(255,255,255,.18);backdrop-filter:blur(12px)}
.dock-inner{max-width:820px;margin:auto}
.current-info{display:flex;gap:13px;align-items:center;min-height:39px}
.current-art{display:grid;place-items:center;height:38px;width:38px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);font-size:23px;font-style:italic}
.current-titles{display:flex;flex-direction:column;min-width:0;gap:3px;flex:1}
.current-titles strong{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.current-titles span{font-size:10px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timeline{display:flex;align-items:center;gap:10px;margin:7px 0 1px}
.time{color:#a6a6a6;font-size:10px;font-variant-numeric:tabular-nums;min-width:32px}
.time:last-child{text-align:right}
input[type=range]{accent-color:#eee;cursor:pointer}
#seek{flex:1;min-width:0;height:18px;touch-action:none}
.transport{display:flex;align-items:center;justify-content:space-between;gap:5px;padding:0 8px 0 6px;height:58px}
.transport button{height:42px;min-width:40px;display:grid;place-items:center;position:relative;border-radius:50%}
.transport button:active{transform:scale(.88);background:rgba(255,255,255,.09)}
.transport svg{width:20px;height:20px;stroke:#f1f1f1;fill:none;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.transport button.play{width:50px;height:50px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2)}
.transport button.play svg{width:24px;height:24px}
.transport button[aria-pressed=true]{filter:drop-shadow(0 0 6px rgba(255,255,255,.35))}
.transport button[aria-pressed=true]:after{content:"";position:absolute;bottom:0;left:50%;height:3px;width:3px;background:#fff;border-radius:50%;transform:translateX(-50%)}
.transport button.liked svg{fill:white}
.repeat-one{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:9px;background:#191919;font-weight:800;padding:0 2px;display:none}
#repeatButton[data-mode=one] .repeat-one{display:block}
.volume-row{display:flex;align-items:center;justify-content:flex-end;gap:8px;color:#999;font-size:10px;margin:-1px 7px -3px 0}
.volume-row input{width:88px;height:15px}
.overlay{position:fixed;z-index:7;inset:0;background:rgba(0,0,0,.67);display:none;justify-content:center;align-items:end}
.overlay.open{display:flex}
.sheet{width:100%;max-width:820px;background:#111;border:1px solid rgba(255,255,255,.18);border-bottom:0;border-radius:23px 23px 0 0;padding:19px 20px calc(27px + env(safe-area-inset-bottom));max-height:70vh;overflow:auto;box-shadow:0 -12px 70px rgba(0,0,0,.5)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet h2{margin:0;font-size:19px}
.sheet p{color:#aaa;font-size:12px;line-height:1.5}
.sheet button.close{font-size:24px;width:34px;height:34px}
.sheet-choice{display:flex;align-items:center;justify-content:space-between;padding:14px 3px;width:100%;border-bottom:1px solid rgba(255,255,255,.08);font-size:13px;text-align:left}
.sheet-choice span:last-child{color:#aaa;font-size:11px}
.sheet input{width:100%;height:45px;border-radius:11px;background:#1c1c1c;border:1px solid rgba(255,255,255,.2);padding:0 13px;color:#fff;outline:0}
.sheet-primary{background:#eee;color:#111;padding:13px 16px;border-radius:11px;width:100%;font-weight:650;margin-top:14px}
.toast{position:fixed;z-index:9;top:20%;left:50%;transform:translateX(-50%) translateY(-8px);padding:11px 17px;background:#2a2a2a;color:#f6f6f6;border:1px solid rgba(255,255,255,.16);border-radius:12px;font-size:12px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap;max-width:86vw;overflow:hidden;text-overflow:ellipsis}
.toast.visible{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:365px){.shell{padding-left:13px;padding-right:13px}.tabs{gap:21px}.track{gap:7px;grid-template-columns:38px minmax(0,1fr) auto 27px 27px}.track-art{height:38px;width:38px}.track-length{font-size:10px}.brand-logo{width:79px}.sort-control select{max-width:106px}}
@media(prefers-reduced-motion:reduce){.digit{animation:none}*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas><div class="haze" aria-hidden="true"></div>
<main class="shell">
 <header class="header">
  <div class="brand">
   <div class="brand-logo" role="img" aria-label="Animated 999 WRLD emblem"><span class="digit">9</span><span class="digit">9</span><span class="digit">9</span></div>
   <span class="brand-text"><strong>WRLD</strong><small>Android Edition</small></span>
  </div>
  <button class="outline" id="updatesButton">Updates ↗</button>
 </header>
 <section class="hero"><div class="eyebrow">YOUR MUSIC, YOUR WRLD</div><h1>Listen differently.</h1><p id="folderStatus">Discovering music on this device…</p></section>
 <label class="search-wrap">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.7"/><path d="m16 16 5 5"/></svg>
  <input type="search" id="search" placeholder="Search your songs…" autocomplete="off" aria-label="Search songs">
 </label>
 <div class="shuffle-all-row">
   <button class="shuffle-all" id="shuffleAllBtn" type="button" disabled aria-label="Shuffle all songs">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h3c6 0 6 12 12 12h3m-4-4 4 4-4 4M3 18h3c3 0 4.5-3 6-6s3-6 6-6h3m-4-4 4 4-4 4"/></svg>
    <span>Shuffle All</span>
   </button>
   <span class="shuffle-hint">Play your entire library in random order</span>
 </div>
 <nav class="tabs" aria-label="Library views">
  <button class="tab active" data-view="all">All songs</button>
  <button class="tab" data-view="liked">Liked <span id="likedCount"></span></button>
  <button class="tab" data-view="playlists">Playlists</button>
 </nav>
 <div class="toolbar">
  <div class="toolbar-left"><span class="toolbar-title" id="sectionTitle">All songs</span><span class="toolbar-sub" id="sectionSubtitle">Loading library…</span></div>
  <label class="sort-control" id="sortGroup"><span>Sort</span>
   <select id="sort" aria-label="Sort songs">
    <option value="title">Title A–Z</option><option value="title-reverse">Title Z–A</option>
    <option value="length-long">Longest</option><option value="length-short">Shortest</option>
    <option value="recent">Recently added</option><option value="oldest">Oldest first</option>
    <option value="artist">Artist</option>
   </select>
  </label>
 </div>
 <div id="list" class="list"></div>
</main>
<footer class="dock"><div class="dock-inner">
 <div class="current-info"><div class="current-art">9</div><div class="current-titles"><strong id="currentTitle">Select a song</strong><span id="currentArtist">Your music stays on your phone</span></div></div>
 <div class="timeline"><span class="time" id="elapsed">0:00</span><input type="range" id="seek" value="0" min="0" max="1000" step="1" aria-label="Seek"><span class="time" id="total">0:00</span></div>
 <div class="transport">
  <button id="likeButton" aria-label="Like current song" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M20.7 5.1a5.6 5.6 0 0 0-7.9 0L12 6l-.8-.9a5.6 5.6 0 0 0-7.9 7.9L12 22l8.7-9a5.6 5.6 0 0 0 0-7.9Z"/></svg></button>
  <button id="previousButton" aria-label="Previous song"><svg viewBox="0 0 24 24"><path d="M6 5v14 M18 6l-9 6 9 6"/></svg></button>
  <button id="playButton" class="play" aria-label="Play"><svg id="playIcon" viewBox="0 0 24 24"><path d="M8.5 5 19 12 8.5 19Z"/></svg></button>
  <button id="nextButton" aria-label="Next song"><svg viewBox="0 0 24 24"><path d="M18 5v14 M6 6l9 6-9 6"/></svg></button>
  <button id="repeatButton" data-mode="off" aria-label="Repeat off" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M17 3.5 20.5 7 17 10.5 M3.5 10V8.5A3.5 3.5 0 0 1 7 5h13.5 M7 20.5 3.5 17 7 13.5 M20.5 14v1.5A3.5 3.5 0 0 1 17 19H3.5"/></svg><span class="repeat-one">1</span></button>
 </div>
 <div class="volume-row"><span>Volume</span><input id="volume" type="range" min="0" max="100" step="1" value="10" aria-label="App volume"><span id="volumeLabel">10%</span></div>
</div></footer>
<div class="overlay" id="overlay"><div class="sheet">
 <div class="sheet-head"><h2 id="sheetTitle">Options</h2><button type="button" class="close" id="closeSheet" aria-label="Close">×</button></div>
 <div id="sheetBody"></div>
</div></div>
<div id="toast" class="toast" role="status"></div>
<script>
(function(){
"use strict";
const el=function(id){return document.getElementById(id)};
const call=function(method){try{if(!window.WRLDNative)return;var args=Array.prototype.slice.call(arguments,1);return window.WRLDNative[method].apply(window.WRLDNative,args)}catch(error){notice("Android connection unavailable");}};
const app={songs:[],map:new Map(),liked:new Set(),playlists:[],view:"all",playlistId:"",query:"",sort:"title",visible:[],displayed:0,player:{id:"",playing:false,position:0,duration:0,volume:0.1,repeat:"off"},menuSong:"",permission:false};
const heart='<svg viewBox="0 0 24 24"><path d="M20.7 5.1a5.6 5.6 0 0 0-7.9 0L12 6l-.8-.9a5.6 5.6 0 0 0-7.9 7.9L12 22l8.7-9a5.6 5.6 0 0 0 0-7.9Z"/></svg>';
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmt(ms){var seconds=Math.floor(Math.max(0,Number(ms)||0)/1000);return Math.floor(seconds/60)+":"+String(seconds%60).padStart(2,"0")}
var toastTimer;
function notice(message){var t=el("toast");t.textContent=message; t.classList.add("visible");clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove("visible")},2700)}
function playlist(){return app.playlists.find(function(p){return p.id===app.playlistId})}
function songsForView(){
 var all=app.songs;
 if(app.view==="liked")all=all.filter(function(s){return app.liked.has(s.id)});
 if(app.view==="playlist"){var p=playlist();if(!p)return [];return (p.ids||[]).map(function(id){return app.map.get(String(id))}).filter(Boolean).filter(match)}
 return all.filter(match).sort(compare);
}
function match(song){var q=app.query.trim().toLowerCase();return !q||song.title.toLowerCase().includes(q)||song.artist.toLowerCase().includes(q)||song.album.toLowerCase().includes(q)}
function compare(a,b){
 var result=0;
 switch(app.sort){
 case "length-long":result=(b.duration||0)-(a.duration||0);break;
 case "length-short":result=(a.duration||0)-(b.duration||0);break;
 case "recent":result=(b.modified||0)-(a.modified||0);break;
 case "oldest":result=(a.modified||0)-(b.modified||0);break;
 case "artist":result=a.artist.localeCompare(b.artist);break;
 case "title-reverse":result=b.title.localeCompare(a.title);break;
 default:result=a.title.localeCompare(b.title);
 }
 return result||a.title.localeCompare(b.title);
}
function setView(name,id){app.view=name;app.playlistId=id||"";app.displayed=0;document.querySelectorAll(".tab").forEach(function(t){t.classList.toggle("active",t.dataset.view===name||(name==="playlist"&&t.dataset.view==="playlists"))});render()}
function render(){
 el("likedCount").textContent=app.liked.size?" "+app.liked.size:"";
 var title="All songs",sub="",isLists=app.view==="playlists";
 if(app.view==="liked")title="Liked songs";
 if(isLists)title="Playlists";
 if(app.view==="playlist")title=playlist()?playlist().name:"Playlist";
 el("sectionTitle").textContent=title;
 el("sortGroup").style.display=(isLists||app.view==="playlist")?"none":"flex";
 if(isLists){el("sectionSubtitle").textContent=app.playlists.length+" collections";renderPlaylists();return}
 app.visible=songsForView();
 el("sectionSubtitle").textContent=app.visible.length+" songs";
 app.displayed=0;
 el("list").innerHTML="";
 if(app.view==="playlist"){
   var back=document.createElement("button");back.className="tiny-action";back.textContent="← All playlists";back.dataset.back="1";el("list").appendChild(back);
   var del=document.createElement("button");del.className="tiny-action";del.style.margin="11px 0";del.textContent="Delete playlist";del.dataset.delete="1";el("list").appendChild(del);
 }
 if(app.visible.length===0){
  var empty=document.createElement("div");empty.className="empty";empty.innerHTML="<b>No songs here yet</b>"+(app.permission?"Allow music access in Settings, then tap Rescan.":"Add music to your phone or change your search.");el("list").appendChild(empty);return;
 }
 appendTracks();
}
function appendTracks(){
 var start=app.displayed, end=Math.min(start+90,app.visible.length);
 if(start>=end)return;
 var fragment=document.createDocumentFragment();
 for(var i=start;i<end;i++){
  var s=app.visible[i],row=document.createElement("div");
  row.className="track"+(app.player.id===s.id?" is-current":"");
  row.dataset.song=s.id;
  row.innerHTML='<div class="track-art">9</div><div class="track-main"><span class="track-title">'+esc(s.title)+'</span><span class="track-sub">'+esc(s.artist)+'</span></div><span class="track-length">'+(s.duration>0?fmt(s.duration):"—")+'</span><button class="icon-btn'+(app.liked.has(s.id)?" liked":"")+'" data-like="'+esc(s.id)+'" aria-label="Like song">'+heart+'</button><button class="icon-btn plus" data-menu="'+esc(s.id)+'" aria-label="Add song to playlist">+</button>';
  fragment.appendChild(row);
 }
 el("list").appendChild(fragment); app.displayed=end;
}
window.addEventListener("scroll",function(){if(window.innerHeight+window.scrollY>document.body.scrollHeight-850)appendTracks()},{passive:true});
function renderPlaylists(){
 var out='<div class="playlist-grid"><button class="playlist-card playlist-create" data-create="1"><span class="playlist-cover">＋</span><span><strong class="playlist-name">New playlist</strong><small class="playlist-count">Make a new collection</small></span></button>';
 app.playlists.forEach(function(p){out+='<button class="playlist-card" data-open="'+esc(p.id)+'"><span class="playlist-cover">✦</span><span><strong class="playlist-name">'+esc(p.name)+'</strong><small class="playlist-count">'+(p.ids||[]).filter(function(id){return app.map.has(String(id))}).length+' songs</small></span></button>'});
 el("list").innerHTML=out+"</div>";
}
function playIndex(i){
 var ids=app.visible.map(function(s){return s.id});
 if(!ids.length)return;
 call("playQueue",JSON.stringify(ids),i);
}
function shuffleAll(){
 // Always include the entire indexed music library, independent of the
 // current playlist, tab, text search, or sort order.
 var ids=app.songs.map(function(song){return song.id});
 if(!ids.length){notice("No songs to shuffle");return}
 // Fisher–Yates: create a fresh, unbiased random playback order.
 for(var i=ids.length-1;i>0;i--){
  var j=Math.floor(Math.random()*(i+1));
  var temp=ids[i];ids[i]=ids[j];ids[j]=temp;
 }
 call("playQueue",JSON.stringify(ids),0);
 notice("Shuffling "+ids.length+" songs");
}
function renderNow(){
 var song=app.map.get(app.player.id);
 el("currentTitle").textContent=song?song.title:"Select a song";
 el("currentArtist").textContent=song?song.artist:"Your music stays on your phone";
 el("playIcon").innerHTML=app.player.playing?'<rect x="6.5" y="5.5" width="3.5" height="13" rx="1" fill="white" stroke="none"/><rect x="14" y="5.5" width="3.5" height="13" rx="1" fill="white" stroke="none"/>':'<path d="M8.5 5 19 12 8.5 19Z"/>';
 el("playButton").setAttribute("aria-label",app.player.playing?"Pause":"Play");
 el("elapsed").textContent=fmt(app.player.position);
 el("total").textContent=fmt(app.player.duration);
 if(document.activeElement!==el("seek")){
  el("seek").value=String(app.player.duration>0?Math.round(1000*app.player.position/app.player.duration):0);
 }
 var liked=!!app.player.id&&app.liked.has(app.player.id);
 el("likeButton").classList.toggle("liked",liked);
 el("likeButton").setAttribute("aria-pressed",String(liked));
 el("likeButton").setAttribute("aria-label",liked?"Unlike current song":"Like current song");
 el("repeatButton").dataset.mode=app.player.repeat;
 el("repeatButton").setAttribute("aria-pressed",String(app.player.repeat!=="off"));
 el("repeatButton").setAttribute("aria-label",app.player.repeat==="one"?"Repeat one":app.player.repeat==="all"?"Repeat all":"Repeat off");
 if(document.activeElement!==el("volume"))el("volume").value=String(Math.round(app.player.volume*100));
 el("volumeLabel").textContent=Math.round(app.player.volume*100)+"%";
}
function showSheet(title,html){el("sheetTitle").textContent=title;el("sheetBody").innerHTML=html;el("overlay").classList.add("open")}
function hideSheet(){el("overlay").classList.remove("open")}
function openTrackMenu(id){
 app.menuSong=id;var song=app.map.get(id);if(!song)return;
 var out='<p>Choose a playlist for this track. Tap again to remove it.</p>';
 if(!app.playlists.length)out+='<div class="empty">Create a playlist first.</div>';
 app.playlists.forEach(function(p){
  var active=(p.ids||[]).includes(id);
  out+='<button class="sheet-choice" data-add="'+esc(p.id)+'"><span>'+esc(p.name)+'</span><span>'+(active?"✓ Added":"+ Add")+'</span></button>';
 });
 out+='<button class="sheet-choice" data-create="1"><span>＋ New playlist</span><span>Create</span></button>';
 showSheet(song.title,out);
}
function createDialog(){showSheet("New playlist",'<p>Name your collection.</p><input id="newPlaylistName" maxlength="70" placeholder="Playlist name" autocomplete="off"><button class="sheet-primary" id="confirmPlaylist">Create playlist</button>');setTimeout(function(){el("newPlaylistName")&&el("newPlaylistName").focus()},100)}
el("list").addEventListener("click",function(event){
 var b=event.target.closest("[data-like],[data-menu],[data-create],[data-open],[data-delete],[data-back],[data-song]");
 if(!b)return;
 if(b.dataset.like){call("setLike",b.dataset.like,!app.liked.has(b.dataset.like));return}
 if(b.dataset.menu){openTrackMenu(b.dataset.menu);return}
 if(b.dataset.create){createDialog();return}
 if(b.dataset.open){setView("playlist",b.dataset.open);return}
 if(b.dataset.back){setView("playlists");return}
 if(b.dataset.delete){var p=playlist();if(p)showSheet("Delete playlist?",'<p>Delete '+esc(p.name)+'? Music files will not be deleted.</p><button class="sheet-primary" data-confirm-delete="'+esc(p.id)+'">Delete playlist</button>');return}
 if(b.dataset.song){var i=app.visible.findIndex(function(s){return s.id===b.dataset.song});if(i>=0)playIndex(i)}
});
el("overlay").addEventListener("click",function(e){if(e.target===el("overlay"))hideSheet()});
el("closeSheet").addEventListener("click",hideSheet);
el("sheetBody").addEventListener("click",function(e){
 var b=e.target.closest("button");if(!b)return;
 if(b.dataset.add){call("togglePlaylist",b.dataset.add,app.menuSong);hideSheet();notice("Playlist updated");return}
 if(b.dataset.create){createDialog();return}
 if(b.dataset.confirmDelete){call("deletePlaylist",b.dataset.confirmDelete);hideSheet();setView("playlists");return}
 if(b.id==="confirmPlaylist"){var name=(el("newPlaylistName").value||"").trim();if(name){call("createPlaylist",name);hideSheet();notice("Playlist created")}else notice("Enter a playlist name")}
});
document.querySelectorAll(".tab").forEach(function(t){t.addEventListener("click",function(){setView(t.dataset.view)})});
el("search").addEventListener("input",function(e){app.query=e.target.value;render()});
el("sort").addEventListener("change",function(e){app.sort=e.target.value;render()});
el("shuffleAllBtn").addEventListener("click",shuffleAll);
el("playButton").addEventListener("click",function(){if(!app.player.id&&app.visible.length)playIndex(0);else call("togglePlay")});
el("previousButton").addEventListener("click",function(){call("previous")});
el("nextButton").addEventListener("click",function(){call("next")});
el("likeButton").addEventListener("click",function(){if(app.player.id)call("setLike",app.player.id,!app.liked.has(app.player.id));else notice("Choose a song first")});
el("repeatButton").addEventListener("click",function(){var m=app.player.repeat;var next=m==="off"?"all":m==="all"?"one":"off";call("setRepeat",next);app.player.repeat=next;renderNow();notice(next==="off"?"Repeat off":next==="all"?"Repeat all":"Repeat one")});
el("seek").addEventListener("input",function(e){el("elapsed").textContent=fmt((Number(e.target.value)/1000)*app.player.duration)});
el("seek").addEventListener("change",function(e){call("seek",Math.floor(Number(e.target.value)/1000*app.player.duration));e.target.blur()});
var volumeTimer;
el("volume").addEventListener("input",function(e){var v=Number(e.target.value);el("volumeLabel").textContent=v+"%";clearTimeout(volumeTimer);volumeTimer=setTimeout(function(){call("setVolume",v/100);el("volume").blur()},70)});
el("updatesButton").addEventListener("click",function(){call("openUpdates")});
window.WRLD={
 receiveLibrary:function(data){app.songs=Array.isArray(data.songs)?data.songs:[];app.map=new Map(app.songs.map(function(s){s.id=String(s.id);return [s.id,s]}));app.permission=false;el("folderStatus").textContent=app.songs.length+" local audio files found";el("shuffleAllBtn").disabled=app.songs.length===0;render();renderNow()},
 receiveCollections:function(data){app.liked=new Set((data.liked||[]).map(String));app.playlists=Array.isArray(data.playlists)?data.playlists.map(function(p){return {id:String(p.id),name:String(p.name),ids:(p.ids||[]).map(String)}}):[];render();renderNow()},
 receivePlayer:function(data){var previous=app.player.id;app.player={id:String(data.id||""),playing:!!data.playing,position:Number(data.position)||0,duration:Number(data.duration)||0,volume:Number(data.volume==null?.1:data.volume),repeat:data.repeat||"off"};renderNow();if(previous!==app.player.id)document.querySelectorAll(".track").forEach(function(row){row.classList.toggle("is-current",row.dataset.song===app.player.id)})},
 permissionDenied:function(){app.permission=true;el("folderStatus").textContent="Music access is required to list local songs.";el("list").innerHTML='<div class="empty"><b>Allow music access</b>Enable Music permission in Android Settings, then return and use Rescan.<div style="margin-top:16px"><button class="outline" id="rescan">Rescan</button></div></div>';var b=el("rescan");if(b)b.addEventListener("click",function(){call("requestLibrary")})},
 showMessage:notice
};
renderNow();
function startSky(){
 var canvas=el("stars"),ctx=canvas.getContext("2d");if(!ctx)return;
 var w=1,h=1,dpr=1,stars=[],last=0,lastDraw=0;
 function random(a,b){return a+Math.random()*(b-a)}
 function resize(){
  dpr=Math.min(1.25,window.devicePixelRatio||1);w=innerWidth;h=innerHeight;
  canvas.width=Math.ceil(w*dpr);canvas.height=Math.ceil(h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var count=Math.min(90,Math.max(28,Math.floor(w*h/4800)));
  stars=Array.from({length:count},function(){return {x:random(0,w),y:random(0,h),radius:random(.35,1.25),speed:random(2,11),phase:random(0,6.28),rate:random(.5,2.1),bright:random(.22,.8)}});
 }
 function frame(time){
  if(document.hidden){last=0;lastDraw=0;return}
  // About 25 FPS is sufficient for the subtle twinkle and drift on a phone.
  if(time-lastDraw<40){requestAnimationFrame(frame);return}
  var dt=Math.min((time-(last||time))/16.67,3);last=time;lastDraw=time;
  ctx.fillStyle="#050505";ctx.fillRect(0,0,w,h);
  ctx.fillStyle="#fff";
  stars.forEach(function(s){
   s.x-=s.speed*dt*.06;if(s.x<0)s.x=w;
   var glow=s.bright*(.62+.38*Math.sin(time*.001*s.rate+s.phase));
   ctx.globalAlpha=Math.max(.08,glow);
   ctx.beginPath();ctx.arc(s.x,s.y,s.radius,0,Math.PI*2);ctx.fill();
  });ctx.globalAlpha=1;
  requestAnimationFrame(frame);
 }
 window.addEventListener("resize",resize,{passive:true});
 document.addEventListener("visibilitychange",function(){if(!document.hidden)requestAnimationFrame(frame)});
 resize();requestAnimationFrame(frame);
}
startSky();
})();
