name: Build and publish WRLD for Windows

# Push source and bump app_version.py: GitHub does the rest.
# No local Windows build, tag push, or manual Release creation required.
on:
  push:
    branches:
      - main
    paths:
      - 'app_version.py'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wrld-windows-release
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read version and skip existing releases
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (python -c "from app_version import APP_VERSION; print(APP_VERSION)").Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version in app_version.py: $version" }
          $tag = "v$version"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          gh release view "$tag" --repo "$env:GITHUB_REPOSITORY" > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$tag is already published; nothing to build."
            "publish=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Preparing new release $tag"
            "publish=true" >> $env:GITHUB_OUTPUT
          }
          $global:LASTEXITCODE = 0

      - name: Install build tools
        if: steps.release.outputs.publish == 'true'
        run: python -m pip install "pyinstaller>=6.11,<7" "pywebview>=6.1,<7" "truststore>=0.10,<1"

      - name: Test private WRLD Cloud API
        if: steps.release.outputs.publish == 'true'
        run: python -m unittest discover -s tests -p test_cloud.py -v

      - name: Test Cloudflare Worker backend
        if: steps.release.outputs.publish == 'true'
        run: python -m unittest discover -s tests -p test_cloud_backend.py -v

      - name: Validate desktop WebView JavaScript
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        run: |
          python -c "import pathlib,re; html=pathlib.Path('web/index.html').read_text(encoding='utf-8'); scripts=re.findall(r'<script>(.*?)</script>',html,re.S); assert len(scripts)==1, 'Expected one main desktop script'; pathlib.Path('desktop-ui-check.js').write_text(scripts[0],encoding='utf-8')"
          node --check desktop-ui-check.js

      - name: Build Windows EXE
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name WRLD --icon web/favicon.ico --add-data "web;web" --collect-all webview --collect-all truststore --hidden-import clr --hidden-import webview.platforms.edgechromium native.py

      - name: Check packaged EXE starts before publishing
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        run: |
          $info = [System.Diagnostics.ProcessStartInfo]::new()
          $info.FileName = (Join-Path $env:GITHUB_WORKSPACE 'dist/WRLD.exe')
          $info.Arguments = '--startup-probe'
          $info.UseShellExecute = $false
          $info.CreateNoWindow = $true
          $process = [System.Diagnostics.Process]::Start($info)
          if (-not $process) { throw "Could not start bundled EXE" }
          try {
            if (-not $process.WaitForExit(30000)) {
              $process.Kill()
              throw "WRLD.exe startup probe timed out"
            }
            if ($process.ExitCode -ne 0) { throw "WRLD.exe startup probe failed with exit code $($process.ExitCode)" }
          } finally {
            $process.Dispose()
          }

      - name: Make release checksum
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        run: |
          $h = (Get-FileHash -LiteralPath dist/WRLD.exe -Algorithm SHA256).Hash.ToLower()
          "$h  WRLD.exe" | Set-Content -Path dist/WRLD.exe.sha256 -NoNewline -Encoding ascii

      - name: Publish versioned release
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          gh release create "$tag" "dist/WRLD.exe" "dist/WRLD.exe.sha256" --target "${{ github.sha }}" --title "WRLD $tag" --notes "WRLD Windows v1.8.21: precise A-Z top alignment with smoother warp navigation; updater reliability improvements and Windows Python 3.12 runtime packaging."
