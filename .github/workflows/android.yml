name: Build WRLD Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wrld-android-beta
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate WebView JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path("android/app/src/main/assets/index.html").read_text(encoding="utf-8")
          matches = re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>", source, re.DOTALL)
          if len(matches) != 1:
              raise SystemExit(f"Expected one inline script, found {len(matches)}")
          Path("/tmp/wrld-android-ui.js").write_text(matches[0], encoding="utf-8")
          PY
          node --check /tmp/wrld-android-ui.js
      - name: Build debug-signed Android APK
        run: gradle -p android :app:assembleDebug --stacktrace --no-daemon
      - name: Enable KVM for emulator startup check
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke-test Android app launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash android/scripts/smoke-test.sh
      - name: Prepare APK and checksum
        run: |
          mkdir -p android/dist
          cp android/app/build/outputs/apk/debug/app-debug.apk android/dist/WRLD-Android-v0.1.10.apk
          cd android/dist
          sha256sum WRLD-Android-v0.1.10.apk > WRLD-Android-v0.1.10.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: WRLD-Android-v0.1.10
          path: android/dist/*
          if-no-files-found: error
      - name: Publish Android beta (only once per version)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v0.1.10"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Android beta $TAG already exists; keeping existing published APK."
          else
            gh release create "$TAG" android/dist/WRLD-Android-v0.1.10.apk android/dist/WRLD-Android-v0.1.10.apk.sha256 --target "$GITHUB_SHA" --title "WRLD Android v0.1.10 (beta)" --notes "WRLD Android: Up Next is now integrated beneath the playback progress bar. The mini-player expands upward in a single continuous pull motion, with no separate popup or dimming effect. Includes a tappable/swipeable queue grip; tab animations remain. Android 8+. Note: This initial APK uses a temporary CI debug signing key and is for testing; future APKs may require uninstalling this beta until a persistent private signing key is configured."
          fi
