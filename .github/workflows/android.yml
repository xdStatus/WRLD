name: Build WRLD Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wrld-android-beta
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate WebView JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path("android/app/src/main/assets/index.html").read_text(encoding="utf-8")
          matches = re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>", source, re.DOTALL)
          if len(matches) != 1:
              raise SystemExit(f"Expected one inline script, found {len(matches)}")
          Path("/tmp/wrld-android-ui.js").write_text(matches[0], encoding="utf-8")
          PY
          node --check /tmp/wrld-android-ui.js
      - name: Test Android reverse sorting
        run: node android/scripts/test-sort.js
      - name: Verify Android update feature integration
        run: node android/scripts/test-updates.js
      - name: Build debug-signed Android APK
        run: gradle -p android :app:assembleDebug --stacktrace --no-daemon
      - name: Enable KVM for emulator startup check
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke-test Android app launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash android/scripts/smoke-test.sh
      # Only a release APK with the permanent matching certificate may be published.
      # Runner-generated debug keys are never used for published Android builds.
      - name: Restore permanent Android signing key
        shell: bash
        env:
          WRLD_ANDROID_KEYSTORE_BASE64: ${{ secrets.WRLD_ANDROID_KEYSTORE_BASE64 }}
          WRLD_KEYSTORE_PASSWORD: ${{ secrets.WRLD_ANDROID_STORE_PASSWORD }}
          WRLD_KEY_ALIAS: ${{ secrets.WRLD_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "$WRLD_ANDROID_KEYSTORE_BASE64" || -z "$WRLD_KEYSTORE_PASSWORD" || -z "$WRLD_KEY_ALIAS" ]]; then
            echo "::error::Signing secrets missing: set WRLD_ANDROID_KEYSTORE_BASE64, WRLD_ANDROID_STORE_PASSWORD and WRLD_ANDROID_KEY_ALIAS in repository Settings > Secrets and variables > Actions. No Android release can be published."
            exit 1
          fi
          export WRLD_KEYSTORE_PATH="$RUNNER_TEMP/wrld-android-signing.p12"
          python3 - <<'PY'
          import base64, os, pathlib
          data = base64.b64decode(os.environ["WRLD_ANDROID_KEYSTORE_BASE64"], validate=True)
          if not 1024 <= len(data) <= 65536:
              raise SystemExit("Invalid signing keystore size")
          path = pathlib.Path(os.environ["WRLD_KEYSTORE_PATH"])
          path.write_bytes(data)
          path.chmod(0o600)
          PY
          echo "WRLD_KEYSTORE_PATH=$WRLD_KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "Signing keystore restored privately on temporary build runner."

      - name: Verify permanent certificate fingerprint
        shell: bash
        env:
          WRLD_KEYSTORE_PASSWORD: ${{ secrets.WRLD_ANDROID_STORE_PASSWORD }}
          WRLD_KEY_ALIAS: ${{ secrets.WRLD_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -exportcert -storetype PKCS12 \
            -keystore "$WRLD_KEYSTORE_PATH" -storepass "$WRLD_KEYSTORE_PASSWORD" \
            -alias "$WRLD_KEY_ALIAS" -file "$RUNNER_TEMP/wrld-public-cert.der" >/dev/null 2>&1
          ACTUAL="$(sha256sum "$RUNNER_TEMP/wrld-public-cert.der" | cut -d' ' -f1)"
          EXPECTED="$(tr -d '\r\n[:space:]' < android/signing-cert.sha256)"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::Signing key differs from the pinned WRLD Android certificate. No APK was published."
            exit 1
          fi
          echo "Verified permanent WRLD Android signing certificate."

      - name: Build permanently signed Android release APK
        shell: bash
        env:
          WRLD_KEYSTORE_PASSWORD: ${{ secrets.WRLD_ANDROID_STORE_PASSWORD }}
          WRLD_KEY_ALIAS: ${{ secrets.WRLD_ANDROID_KEY_ALIAS }}
        run: gradle -p android :app:assembleRelease --stacktrace --no-daemon

      - name: Verify published APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -s "$APK"
          "$SIGNER" verify --verbose "$APK" >/dev/null
          ACTUAL="$("$SIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d '\r')"
          EXPECTED="$(tr -d '\r\n[:space:]' < android/signing-cert.sha256)"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::APK signature does not match the pinned signing certificate. Refusing to publish."
            exit 1
          fi
          echo "Release APK signature verified against pinned certificate."

      - name: Prepare APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/dist
          cp android/app/build/outputs/apk/release/app-release.apk android/dist/WRLD-Android-v0.1.15.apk
          cd android/dist
          sha256sum WRLD-Android-v0.1.15.apk > WRLD-Android-v0.1.15.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: WRLD-Android-v0.1.15
          path: android/dist/*
          if-no-files-found: error
      - name: Publish permanently signed Android beta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="android-v0.1.15"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already exists. Refusing to overwrite an existing signed release."
            exit 1
          fi
          gh release create "$TAG" android/dist/WRLD-Android-v0.1.15.apk android/dist/WRLD-Android-v0.1.15.apk.sha256 \
            --target "$GITHUB_SHA" --title "WRLD Android v0.1.15 (permanently signed beta)" \
            --notes "WRLD Android 0.1.15: permanently signed APK and in-app update checks. Future updates signed with the same certificate can replace this build without losing app data. The old temporary debug-signed betas may require one initial signing migration. Opens the official GitHub Android APK with Android installation confirmation. Cloudflare R2 and music playback remain unchanged."
