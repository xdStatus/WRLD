name: Build and publish WRLD for Windows
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: write
jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build tools
        run: python -m pip install "pyinstaller>=6.11,<7" "pywebview>=5.3.1,<7"
      - name: Check version matches release tag
        shell: pwsh
        run: |
          $v = (python -c "from app_version import APP_VERSION; print(APP_VERSION)").Trim()
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag must match app_version.py ($v)" }
      - name: Build Windows EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name WRLD --icon web/favicon.ico --add-data "web;web" --collect-all webview --hidden-import clr --hidden-import webview.platforms.edgechromium native.py
      - name: Make release checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash -LiteralPath dist/WRLD.exe -Algorithm SHA256).Hash.ToLower()
          "$h  WRLD.exe" | Set-Content -Path dist/WRLD.exe.sha256 -NoNewline -Encoding ascii
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create "$tag" "dist/WRLD.exe" "dist/WRLD.exe.sha256" --title "WRLD $tag" --notes "WRLD for Windows (WebView2 required)."
